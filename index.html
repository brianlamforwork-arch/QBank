a:`<ul><li>Traditional: Engineer administers, risk allocation fixed, claims often settled late and can be adversarial.</li><li>NEC4: mutual trust and cooperation, early warnings and risk reduction meetings, compensation events assessed with time limits, an accepted programme as a key tool.</li><li>Give your own NEC4 experience as evidence.</li></ul>`},
{id:"F24",p:"F",q:"(C8) What would you do if you had a conflict of interest?",
a:`<ul><li>Declare it to your employer or client as soon as you know.</li><li>Step back from decisions affected by it unless the client agrees with full knowledge.</li><li>Link to the HKIE Rules of Conduct and your company's procedures.</li></ul>`},
{id:"F25",p:"F",q:"(C9) A serious accident happens on your site. What do you do?",
a:`<ul><li>Make the site safe, get medical help, and stop the related work.</li><li>Report to the right people and authorities as required, and preserve evidence.</li><li>Investigate root causes (not just blame), revise method statements and risk assessments, and share lessons.</li></ul>`},
{id:"F26",p:"F",q:"(C6) How do you supervise and develop junior staff?",
a:`<ul><li>Give clear tasks, check their work, explain why, not just what.</li><li>Let them take responsibility gradually, with review.</li><li>Give an example: a site inspector or graduate you guided.</li></ul>`},
{id:"F27",p:"F",q:"(C9) How can carbon be reduced in geotechnical works?",
a:`<ul><li>Use less material: optimise design, avoid over-conservatism, reuse existing structures.</li><li>Lower-carbon materials: cement replacement in concrete and grout, recycled aggregates.</li><li>Choose low-carbon solutions (e.g. soil nails and greening instead of large concrete walls, flexible barriers).</li><li>Reduce transport and waste: reuse excavated material on site.</li></ul>`}
);

Q.push(
{id:"A34",p:"A",q:"Why does Geoguide 7 prefer soil nails to cutting back alone, even if both give the same calculated FOS?",
a:`<ul><li>Robustness: GI can miss subtle adverse geological features. A nailed slope redistributes stress, overrides local weaknesses, and is less sensitive to undetected adverse ground and groundwater.</li><li>Redundancy from many nails, and a ductile failure mode that gives warning.</li><li>Construction merits: small plant for cramped sites, adjustable on site, less earthworks and tree felling.</li><li>Limitations: buried services and obstructions, sterilised ground, lot boundaries, high groundwater, permeable ground causing grout loss, fines-rich ground prone to creep, deep-seated landslides, and deformation needed to mobilise force.</li></ul>`},
{id:"A35",p:"A",q:"Compare drill-and-grout, self-drilling and driven soil nails.",
a:`<ul><li>Drill-and-grout: most common. Gets through corestones, drilling spoil shows the ground, suits long nails, hole can be checked. But holes may collapse (casing needed) and drilling disturbs ground.</li><li>Self-drilling: hollow bar drilled with a sacrificial bit, grout as flushing medium; fast and keeps holes open. Poor in corestones, alignment hard for long nails, and durability concerns (grout cover not assured without centralisers, coatings damaged).</li><li>Driven: fast, little disruption, but only short nails, buckling in stiff ground or corestones, and corrosion-prone unless non-corrodible.</li></ul>`},
{id:"A36",p:"A",q:"Explain the two-zone model and how a soil nail is mobilised.",
a:`<ul><li>A potential failure surface separates the active zone (tending to detach) from the passive zone (stable). Nails tie the active zone to the passive zone.</li><li>In the active zone, ground movement mobilises tension through nail–ground friction and the reaction at the head. The tension directly resists shear and increases normal stress on the failure surface.</li><li>In the passive zone, the bond length resists pull-out through soil–grout and grout–bar bond.</li><li>Maximum tension occurs near, but not exactly at, the failure surface. The model is a simplification for limit equilibrium; in reality there is a shear zone.</li></ul>`},
{id:"A37",p:"A",q:"What is the presumed rock–grout bond for soil nails socketed into rock?",
a:`<ul><li>Without detailed investigation, a presumed bond strength of <b>0.35 MPa</b> may be used for nails socketed into a partially weathered rock mass of PW90/100 or better.</li><li>A <b>minimum rock socket of 2 m</b> is recommended, to allow for variable rock near the soil–rock interface.</li><li>Higher values need justification by GI, testing and analysis.</li></ul>`},
{id:"A38",p:"A",q:"Why is σ′v limited to 300 kPa in the pull-out calculation, and what are the method's limits?",
a:`<ul><li>The effective stress method ignores soil arching, restrained dilatancy, suction, hole roughness and over-break.</li><li>At high overburden, arching around the hole may reduce contact stress more than dilatancy and roughness add, so σ′<sub>v</sub> is capped at 300 kPa as a precaution.</li><li>With the recommended F<sub>SG</sub>, experience shows the method is adequately safe for usual Hong Kong conditions.</li><li>Alternatives: SPT-N or pressuremeter correlations, or site-specific pull-out tests (Pun & Shiu, 2007).</li></ul>`},
{id:"A39",p:"A",q:"How is the grout–reinforcement bond checked, and why is it rarely critical?",
a:`<ul><li>Geoguide 7 Eq. 5.3: T<sub>GR</sub> = 2.25 η<sub>1</sub> η<sub>2</sub> f<sub>ctd</sub> P<sub>r</sub> L / F<sub>GR</sub>, using Eurocode 2 bond coefficients and grout tensile strength, with F<sub>GR</sub> = 2.0.</li><li>With deformed bars, bearing of the ribs on the grout gives most of the bond, so this interface is usually much stronger than the soil–grout interface.</li><li>It can matter for short bond lengths, weak grout, or coated or sheathed bars (protection measures can affect bond).</li></ul>`},
{id:"A40",p:"A",q:"What ground conditions cause buildability problems for soil nails, and how do you manage them?",
a:`<ul><li>Excessive grout leakage in: coarse fill (boulders, cobbles), coarse colluvium, erosion pipes, material boundaries and corestone margins, open joints, faults, landslide scars and tension cracks, and drainage lines.</li><li>Leaked grout can dam groundwater; install piezometers if this is a concern.</li><li>Long nails (over about 20 m) more likely hit water and weak zones, causing hole collapse and grout loss.</li><li>For long or closely-spaced nails or difficult ground, do a site trial before main works, possibly with pull-out tests; put details and contingencies in the contract.</li></ul>`},
{id:"A41",p:"A",q:"How should soil nails be grouted, and what do you do about excessive grout take?",
a:`<ul><li>Grout the same day as bar insertion. Grout through a pipe to the bottom of the hole until clean grout returns at the top.</li><li>Keep a pressure head of about <b>1 m above the hole mouth</b> until initial set, to make up for leakage.</li><li>Record grout volume for each hole. If grout take is excessive, notify the designer: options include staged grouting or casing over the leak, and review of the design model.</li><li>Avoid grouting under water; provide dewatering (e.g. raking drains) if needed.</li><li>With corrugated sheathing, prevent sheath distortion or floating during grouting.</li></ul>`},
{id:"A42",p:"A",q:"What are the key supervision checks during soil nail construction?",
a:`<ul><li>Bars and accessories: size, grade, length, galvanising and sheathing intact (no pitting), couplers tight, centralisers adequate.</li><li>Drilling: position, length, inclination and bearing (check with protractor and compass; Eastman camera for long holes), ground and water found, hole left open only briefly, hole clean (mirror and light, or CCTV).</li><li>Insertion: keep a minimum clearance at the hole bottom for grout cover; withdraw and clear if obstructed.</li><li>Grouting and heads (see A41, A49); pull-out tests; excavation sequence.</li><li>Full-time supervision, with insertion, grouting and pull-out tests individually checked. Geoguide 7 Fig. 6.1 gives a sample checklist.</li></ul>`,
fu:"Which aspects can't be verified after installation, and so need the closest supervision?"},
{id:"A43",p:"A",q:"When is a creep test needed, and what are its acceptance criteria?",
a:`<ul><li>For nails carrying sustained loads and bonded in soil, to check susceptibility to long-term creep (especially fines-rich soil).</li><li>Can be part of a pull-out test: one cycle to T<sub>c</sub> = T<sub>DL2</sub> (allowable bond resistance × F<sub>SG</sub>), held 60 minutes.</li><li>Acceptance: movement between 6 and 60 minutes not more than 2 mm or 0.1% of bond length, <b>and</b> the creep rate (movement per log time) decreasing throughout.</li><li>If it fails, revise the design bond strength or move the bond zone to better ground, then re-test.</li></ul>`},
{id:"A44",p:"A",q:"What is the difference between soil nails carrying transient and sustained loads, and why does it matter?",
a:`<ul><li>Transient: the system is stable without nails most of the time; nails act mainly during e.g. high groundwater after heavy rain. Most Hong Kong slope upgrading is this case.</li><li>Sustained: stability can't be maintained without the continued action of the nails.</li><li>Sustained loads need: deformation analysis, creep tests when bonded in soil, stricter corrosion protection (Table 5.9), F<sub>SG</sub> = 2.0, monitoring of movement and nail loads during construction (extended one wet season in unusual conditions), and a performance review before substantial completion.</li></ul>`},
{id:"A45",p:"A",q:"What are the special considerations for soil nails in temporary excavations?",
a:`<ul><li>Same FOS as permanent new slopes, but with groundwater and loading likely during the temporary works.</li><li>Excavate in stages; the exposed height at each stage is set by its own stability.</li><li><b>Build heads and facing before the next stage.</b> Some large landslides have occurred in temporary cuts with nails but no heads.</li><li>If nails carry sustained loads or movement could affect neighbours, do deformation analysis and monitoring. Take care with creep in cohesive soils.</li></ul>`},
{id:"A46",p:"A",q:"What alternative soil nail reinforcement materials exist, and what are their drawbacks?",
a:`<ul><li>Fibre reinforced polymer (carbon, glass, aramid): strong, light, corrosion resistant; but low bending and shear capacity and brittle failure, so a very high FOS may be needed.</li><li>Stainless steel (austenitic, duplex) or stainless-clad bars: corrosion resistant and ductile; costly, little local experience.</li><li>High tensile strand or bar: flexible for tight sites; corrosion-prone and nail–ground interaction not well understood.</li><li>Check combined actions, strain compatibility, grout bond, ductility, durability, handling and testing needs.</li></ul>`},
{id:"A47",p:"A",q:"When can a loose fill slope be upgraded by soil nailing rather than recompaction?",
a:`<ul><li>Geoguide 7 §5.8.1 qualifying criteria: relative compaction of the fill <b>not less than 75%</b>; no significant distress, history of movement, heavy seepage or weak zone (e.g. silt or clay layer); and not in an old valley where groundwater may be high.</li><li>Otherwise use other options such as recompaction.</li><li>Fill formed by end-tipping without compaction is regarded as loose. Fill is loose if contractive or strain-softening; dense if properly compacted and dilative (then design as a cut slope).</li><li>Expect construction difficulties: ground loss, hole collapse, grout loss. Limit open holes, use permanent casing or pre-grouting, and monitor crest facilities.</li></ul>`},
{id:"A48",p:"A",q:"What could cause groundwater damming by soil nails, and how would you check for it?",
a:`<ul><li>Normally nails and grout have no significant damming effect.</li><li>Excessive grout leakage can seal permeable paths and raise groundwater behind the nailed zone.</li><li>If concerned, install piezometers just behind the nailed zone and monitor before and after nailing, placing them where leaked grout is unlikely to block them.</li><li>Prescriptive raking drains can be a contingency.</li></ul>`},
{id:"A49",p:"A",q:"How should soil-nail heads be constructed to avoid defects?",
a:`<ul><li>Honeycombing beneath the bearing plate is a common defect.</li><li>With sprayed concrete, build in two stages: spray to a set thickness, then fix the bearing plate and tighten the nut, then spray the second stage.</li><li>Clean the bar threads and protect them (galvanised or zinc-rich paint). Embed the corrugated sheathing into the head as specified.</li><li>Uncover some heads as a quality check if needed. Recess heads and paint matt where appearance matters.</li></ul>`},
{id:"A50",p:"A",q:"What tests are carried out on soil nail materials and installed nails?",
a:`<ul><li>Material compliance: grout for crushing strength, bleeding and flow cone efflux time; bars for tensile, bend and re-bend tests (frequency per the General Specification for Civil Engineering Works).</li><li>Pull-out tests on sacrificial nails (2% of working nails, minimum two); creep tests where needed.</li><li>Non-destructive: TDR for bar length and grout integrity.</li><li>Destructive (rare): stitch drilling, over-coring or excavation to exhume nails; hard to keep alignment.</li></ul>`}
);
Q.push(
{id:"G1",p:"G",q:"What does Geoguide 1 cover, and what does it not cover?",
a:`<ul><li>Recommended good practice for <b>new permanent earth retaining walls on land</b> in Hong Kong. It adopts the limit state method with partial factors (2nd edition, 1993; continuously updated e-version on the CEDD website).</li><li>Wall types covered: gravity walls (mass concrete, crib, gabion, reinforced fill), reinforced concrete walls (L-shaped, inverted T, counterfort, buttressed), and cantilevered walls (e.g. bored pile walls).</li><li>Not covered: maritime structures, assessment of existing walls, masonry walls, and temporary deep excavation support (sheet pile, soldier pile, diaphragm walls). For excavations, see GCO Publication No. 1/90, and now GEO Publication No. 1/2023.</li></ul>`,
fu:"So which documents would you use to assess an old masonry wall? (e.g. Geotechnical Manual for Slopes, GEO Report on old masonry walls, Geoguide 7 if nailing.)"},
{id:"G2",p:"G",q:"Explain the limit state approach in Geoguide 1.",
a:`<ul><li>A limit state is reached when the wall, or part of it, fails to meet a performance criterion. Each limit state is checked separately and shown to be sufficiently unlikely.</li><li>Ultimate limit state: a failure mechanism forms in the ground or wall, or severe structural damage occurs. States before collapse (e.g. forward sliding of a gravity wall) are also treated as ultimate.</li><li>Serviceability limit state: movements or strains that make the wall unsightly, need unforeseen maintenance, shorten its life, or affect nearby structures and services.</li><li>Checks can be direct (calculate that the limit state is not reached) or indirect (e.g. the middle-third rule for gravity walls as a deformation check).</li><li>Walls should be ductile: give visible warning before failure, not collapse suddenly.</li></ul>`},
{id:"G3",p:"G",q:"How are partial safety factors applied in Geoguide 1?",
a:`<ul><li>Factored load F<sub>f</sub> = γ<sub>f</sub> F; factored material parameter X<sub>f</sub> = X / γ<sub>m</sub>.</li><li>Typical ULS values: soil and wall dead weight γ<sub>f</sub> = 1.0; surcharge γ<sub>f</sub> = 1.5; soil strength c′ and tan φ′ γ<sub>m</sub> = 1.2. Check Tables 6 and 7 for the full set (e.g. undrained strength).</li></ul><div class="f">tan φ′<sub>f</sub> = tan φ′ / γ<sub>m</sub> &nbsp;&nbsp; c′<sub>f</sub> = c′ / γ<sub>m</sub></div><ul><li>Wall friction δ is then assessed from the factored φ′<sub>f</sub>, and ultimate earth pressures use the factored values.</li><li>Sliding: factored base resistance from tan δ<sub>bf</sub> = (tan δ<sub>b</sub>)/γ<sub>m</sub>, with δ<sub>b</sub> from unfactored parameters.</li><li>Serviceability checks: all factors 1.0, except surcharge with a favourable effect gets γ<sub>f</sub> = 0.</li><li>Water pressure: no factor, but use the worst credible groundwater condition.</li><li>Structural design uses unfactored geotechnical loads, then the structural code's load factors.</li></ul>`,
fu:"Why factor tan φ′ rather than φ′ itself?"},
{id:"G4",p:"G",q:"What is the 'worst credible groundwater condition' for retaining wall design?",
a:`<ul><li>The groundwater condition that would arise in extreme events selected for design, assessed from catchment area, recharge potential and drainage.</li><li>It is <b>not</b> the worst possible condition out of context, such as water up to the top of the wall regardless of drainage.</li><li>It is used unfactored in ULS checks; the safety margin comes from the selection itself.</li><li>Accidental water loads (e.g. a burst main) are hard to quantify and are best handled by prescriptive measures such as re-routing or ducting services.</li></ul>`},
{id:"G5",p:"G",q:"What backfill would you specify behind a retaining wall, and what must be excluded?",
a:`<ul><li>Ideal: free-draining, durable, high strength and stiffness, free of harmful matter. Sandy soils from weathered granite or volcanic rocks are usual in Hong Kong if they meet the grading and plasticity limits.</li><li>Exclude: peat, vegetation and organic matter; dangerous or combustible material; metal, rubber, plastic; materials prone to volume change (marine mud, swelling clays, collapsible soils); soluble or chemically aggressive material.</li><li>Clay backfill is not recommended (swelling, shrinkage, consolidation, and much larger movement needed to reach active state). Uniform silts are hard to compact. Weathered shales and mudstones, e.g. Lok Ma Chau Formation, can swell.</li><li>Crushed rock fill is very suitable: hard, well graded, max particle 200 mm, not more than 30% decomposed, with a filter against the retained soil.</li><li>Specify compliance tests: grading, Atterberg limits, moisture content, compaction.</li></ul>`},
{id:"G6",p:"G",q:"What compaction standard does Geoguide 1 recommend for backfill?",
a:`<ul><li>All backfill, filter and drainage material should be compacted, to <b>at least 95%</b> of maximum dry density.</li><li>For level backfill, the <b>top 1.5 m</b> should be fine soil compacted to <b>at least 98%</b>, to limit infiltration, whether or not the surface is paved.</li><li>Sloping backfill: the same standard for a vertical thickness of <b>at least 3 m</b>.</li><li>Design strength must match the compaction specified. Heavy compaction plant should not be used close to the wall unless it is very massive; specify the allowable compaction plant.</li></ul>`},
{id:"G7",p:"G",q:"Why can compaction cause higher pressure on a wall than classical earth pressure theory predicts?",
a:`<ul><li>Compaction plant applies a large temporary load. When it passes, some horizontal stress is locked in, because soil does not unload elastically.</li><li>Near the top, the locked-in lateral pressure can exceed active pressure. Below a certain depth, the normal active or at-rest pressure governs (Ingold's approach).</li><li>Effect: higher pressure on the upper part of the wall, important for stems and light walls.</li><li>Control: account for it in design, limit plant size near the wall, and state the allowable plant on drawings.</li></ul>`},
{id:"G8",p:"G",q:"How does wall movement affect the earth pressure you design for?",
a:`<ul><li>No movement: at-rest pressure (K<sub>0</sub>). Wall moving away from soil: pressure drops to active. Wall pushed into soil: pressure rises to passive.</li><li>Only a small movement is needed for active pressure in granular soil; passive needs much more, so passive is usually only partly mobilised in service.</li><li>Rigid or propped walls (e.g. basement walls, walls tied to structures) should be designed for at-rest or higher pressure.</li><li>Cohesive backfill needs far more movement to reach active, so for a given movement the pressure is higher than for granular fill.</li><li>The mode of movement (rotation about top or base, translation) changes the pressure distribution.</li></ul>`},
{id:"G9",p:"G",q:"What factors govern the choice of retaining wall type?",
a:`<ul><li>Location, nearby structures, space available and whether the support must stay within the site boundary.</li><li>Wall height and the ground profile to be formed.</li><li>Ground and groundwater conditions.</li><li>Acceptable movement during construction and in service, and effects on neighbours.</li><li>Material availability, construction time, appearance, design life and maintenance.</li><li>Walls usually cost more than forming a slope, so first check whether a wall is needed, and keep the retained height low. Compare whole-life cost of alternatives.</li></ul>`},
{id:"G10",p:"G",q:"How do you select soil shear strength parameters for retaining wall design (Geoguide 1 Ch. 5)?",
a:`<ul><li>c′ and φ′ are coefficients of a simplified linear model, valid only over the stress range tested. Envelopes are usually curved; fit to the relevant stress range.</li><li>Be careful with least-squares fits: too few results or variable soil can give a misleading c′.</li><li>Lower bound guide: critical state φ′<sub>cv</sub> about <b>34° for granitic</b> and <b>30° for volcanic</b> Hong Kong soils.</li><li>Compacted fill and residual soil: a c′ = 0 model is often used. Saprolite: consider relict joints and infill; use matrix strength unless corestones can be quantified.</li><li>Watch sampling bias: tested specimens may be stronger (weak material breaks up) or weaker (coarse particles excluded) than the mass.</li><li>Choose cautious "selected values" based on best estimates, test quality, variability and construction effects. Do sensitivity checks.</li></ul>`},
{id:"G11",p:"G",q:"How much ground investigation and testing does a retaining wall need?",
a:`<ul><li>Retained height under about 3 m: parameters can usually be based on previous tests on similar materials, with careful description and classification.</li><li>Over about 6 m: determine parameters from laboratory tests on samples chosen by the designer, or from suitable field tests.</li><li>In between: depends on how sensitive the wall dimensions are to the parameters. A preliminary design helps decide.</li><li>Trial pits are recommended where possible, especially for foundations: they show the soil fabric and allow good block samples.</li><li>Map exposures where persistent relict joints could affect the wall (e.g. bored pile walls), and review the design if adverse features appear during construction.</li></ul>`},
{id:"G12",p:"G",q:"How would you estimate soil stiffness for retaining wall deformation in Hong Kong saprolite?",
a:`<ul><li>Lab tests often underestimate stiffness because of sample disturbance. Back analysis of similar works is preferred.</li><li>For granitic saprolite, effective Young's modulus has been correlated with SPT N: roughly <b>0.2N to 2N MN/m²</b> (Whiteside, 1986). The wide range reflects different derivation methods.</li><li>Unloading or reloading stiffness is much higher: about <b>3 to 4 times</b> virgin loading for preliminary design.</li><li>Stiffness depends on strain level, stress history, construction disturbance, and drainage.</li><li>Field plate loading tests can be used for large walls, allowing for softening of the ground.</li></ul>`},
{id:"G13",p:"G",q:"What is the Winkler (subgrade reaction) model, and what are its limitations for cantilevered walls?",
a:`<ul><li>The wall is modelled as an elastic beam and the soil as a series of independent springs, with pressure proportional to deflection (k<sub>h</sub> = p/y).</li><li>For soil with stiffness increasing with depth, k<sub>h</sub> is taken to increase linearly with depth.</li><li>Limitations: grossly simplified; springs don't interact; the spring stiffness is strain-dependent, so values from very small movements are not valid at large strain.</li><li>Do sensitivity analyses on spring values, and monitor wall deflection to check assumptions.</li></ul>`},
{id:"G14",p:"G",q:"What checks do you carry out for a gravity retaining wall?",
a:`<ul><li>ULS: sliding on the base (factored base friction), overturning, bearing capacity of the foundation, overall stability (slip surfaces passing below the wall), and structural failure of the wall body.</li><li>SLS: limit deformation, commonly by the indirect middle-third rule (resultant within the middle third of the base, so no tension at the heel).</li><li>Also check: foundation softening (blinding concrete on CDG below water), future trenches at the toe, drainage behind the wall.</li><li>For crib and gabion walls: free-draining infill, durability of units or wire, and filters.</li></ul>`,
fu:"Why does keeping the resultant in the middle third limit deformation?"},
{id:"G15",p:"G",q:"What is the 'virtual back' of an L-shaped or inverted T retaining wall?",
a:`<ul><li>A vertical plane through the heel. The soil between the stem and this plane is treated as part of the wall for stability checks.</li><li>Earth pressure is calculated on the virtual back, and the weight of soil above the heel adds to stability.</li><li>Surcharge between the stem and the virtual back helps stability, so it is given a factor of zero where favourable (serviceability), and treated cautiously in ULS checks.</li><li>For structural design of the stem, calculate pressure on the actual stem.</li></ul>`},
{id:"G16",p:"G",q:"How are cantilevered bored pile or caisson walls designed?",
a:`<ul><li>Embedment from equilibrium of active pressure behind and passive resistance in front, using factored parameters for ULS.</li><li>Where socketed into rock, a simplified wedge analysis is often used for socket design; consider joint orientation and mass strength.</li><li>Persistent adverse relict joints or rock discontinuities can control behaviour, so do detailed geological mapping and review during construction.</li><li>Deflection (SLS) by subgrade reaction or numerical analysis, with monitoring.</li><li>Reduce passive resistance for possible future trenches at the toe.</li></ul>`},
{id:"G17",p:"G",q:"How should a roadside retaining wall allow for future utility trenches?",
a:`<ul><li>Geoguide 1: for roadside walls in built-up areas, it is prudent to assume a trench <b>at least 1 m deep</b> at the toe.</li><li>Gravity and RC walls: set the foundation level so future trenching won't undermine the wall.</li><li>Cantilevered walls: reduce passive resistance accordingly.</li><li>Consult the relevant authorities on planned services.</li></ul>`},
{id:"G18",p:"G",q:"How do you design drainage and filters behind a retaining wall?",
a:`<ul><li>Provide a drainage layer behind the wall, protected by a filter, with weepholes or outlets. The design water pressure depends on how reliable the drainage is.</li><li>Granular filters must meet retention and permeability criteria against the retained soil. Check grading of actual soil during construction. No-fines concrete must not be used as a filter.</li><li>Geotextile filters are suitable in non-aggressive conditions (e.g. pH 5 to 10): use resistant polymers from established makers, protect from UV, and ensure good contact with the soil.</li><li>Keep drainage clear by maintenance; blocked weepholes are a warning sign.</li></ul>`},
{id:"G19",p:"G",q:"What surcharge loads must a retaining wall be designed for?",
a:`<ul><li>Types: uniformly distributed, line, point, area, and horizontal loads, plus seismic.</li><li>Geoguide 1 gives nominal surcharges for common situations; use these as minimums and add actual loads (buildings, cranes, stockpiles).</li><li>Line and point loads: spread using elastic or other methods given in Geoguide 1.</li><li>State limits on surcharge on the drawings, including during construction.</li><li>Seismic load is generally not critical in Hong Kong (low to moderate seismicity), but follow Geoguide 1 Section 7.4.</li></ul>`},
{id:"G20",p:"G",q:"What temporary works issues does Geoguide 1 raise for retaining wall construction?",
a:`<ul><li>Responsibility for temporary works design must be clear, and contractor's designs controlled where risk is high.</li><li>Design temporary works to the permanent standard, but allowing for shorter life and less severe conditions (e.g. groundwater).</li><li>Temporary slopes: adequate stability, erosion protection, benching where over about 7.5 m high; remove weak material before backfilling.</li><li>Protect foundations: CDG below water and weak rock deteriorate quickly, so place blinding immediately.</li><li>Groundwater control to prevent piping and weakening; assess dewatering settlement on neighbours.</li><li>Check partially completed walls (e.g. no backfill until top support is built).</li></ul>`},
{id:"G21",p:"G",q:"When should permanent prestressed ground anchors be used in a retaining wall?",
a:`<ul><li>Only when other methods are not practicable, because they impose a long-term maintenance commitment and recurring cost.</li><li>Get the maintenance authority's or owner's agreement first.</li><li>Assess installation suitability, effects on neighbouring structures and services, and rights of adjoining owners.</li><li>Pay special attention to corrosion protection and creep. Follow Geospec 1.</li></ul>`},
{id:"G22",p:"G",q:"What must be in place before using the observational method for a retaining wall?",
a:`<ol><li>Acceptable limits of behaviour established.</li><li>Range of possible behaviour assessed, showing it is likely to be within limits.</li><li>A monitoring plan that detects behaviour early enough, with fast enough instruments, warning levels, and experienced staff.</li><li>A contingency plan if limits are exceeded.</li></ol><p>Typical use: walls supporting embankments on soft ground, monitoring movement and pore pressure. Contingencies: regrading, extra support, drainage, or slowing construction.</p>`},
{id:"G23",p:"G",q:"What should a geotechnical design report for a retaining wall contain?",
a:`<ul><li>Site description: topography, geology, groundwater and surface water, history, utilities and records.</li><li>Critical interpretation of GI and monitoring results.</li><li>Schedule of design assumptions: selected parameters, loads, geometry.</li><li>Anticipated problems and contingency actions.</li><li>Requirements for construction, testing, inspection and maintenance.</li><li>Stability analyses and design calculations.</li><li>Keep factual and interpreted information separate, and record construction-stage checks in an addendum.</li></ul>`},
{id:"G24",p:"G",q:"How do you deal with relict joints and corestones when designing a wall in saprolite?",
a:`<ul><li>Relict joints can cause failure along planes not assumed in soil mechanics theory. Inspect exposures, and map in detail where the wall could be affected (e.g. bored pile walls).</li><li>Use a suitable calculation model and joint strength where adverse joints exist; infill (e.g. kaolin) can be much weaker.</li><li>Corestones: conservative practice is to use matrix strength only, unless their proportion and distribution are reliably known.</li><li>Map during construction and review the design if adverse features appear.</li></ul>`},
{id:"G25",p:"G",q:"What rock parameters might you need for a retaining wall, and how are they estimated?",
a:`<ul><li>Intact strength is rarely critical but is a useful index; Grade III rock is very variable and should be taken conservatively.</li><li>Joint shear strength: basic friction plus roughness at low stress (φ<sub>b</sub> + i), or Barton's model; infilled joints can be very weak.</li><li>Rock mass strength: Hoek-Brown for jointed rock that can be treated as isotropic; otherwise wedge or distinct element analysis.</li><li>Rock mass modulus: much lower than intact; e.g. via a mass factor (BS 8004), modulus ratio (200 to 500 for most Hong Kong rocks), or RMR correlation.</li></ul>`},
{id:"G26",p:"G",q:"What maintenance does a retaining wall need, and how should design allow for it?",
a:`<ul><li>Routine Maintenance Inspections (clear weepholes and drains, remove vegetation, repair cracks) and periodic Engineer Inspections (Geoguide 5).</li><li>Design for maintenance: access, durable materials, drainage that can be cleared, and avoiding features that are hard to inspect.</li><li>Identify maintenance items in the design report and maintenance manual.</li><li>Watch for warning signs: bulging, cracking, blocked weepholes, seepage, leaking services, trees on the wall.</li></ul>`}
);
Q.push(
{id:"H1",p:"H",q:"Please introduce your geotechnical experience in about three minutes.",
a:`<p>Structure it in time order, ending with why you are ready:</p><ol><li>Degree: BSc (Hons) Civil Engineering, HKUST, 2019. MHKIE (Civil) 2026, CEng MICE 2024.</li><li>Design (2019 onwards, C M Wong & Associates): LPMit Stage 2 studies (safety screening of private features, DH Order recommendations), Stage 3 and 3(H) studies (desk study, API, stability analyses of soil slopes, walls and natural hillside, upgrading design), BD DH Order consultancies, sub-soil drainage design at TKO Area 66.</li><li>Site (Jul 2021 to Jul 2025): Assistant Resident Engineer on LPMit GE/2020/05: soil nails, rigid and flexible barriers, pit-by-pit works, soft landscaping, NEC4 administration.</li><li>Current (Executive Engineer): Service Manager's delegate on LPMit GI contracts GE/2025/27 and GE/2023/12.</li><li>Close: "So I have taken geotechnical work from investigation through design to construction and maintenance."</li></ol><p><i>Fill in:</i> one sentence on your most significant personal achievement. Practise it until it takes under 3 minutes.</p>`,
fu:"Which part of that experience was most geotechnically challenging, and why?"},
{id:"H2",p:"H",q:"Show us how you meet the Geotechnical site experience requirement.",
a:`<ul><li>Requirement: normally 12 months on site as (assistant) geotechnical engineer, at least 6 months continuous full-time resident on a medium-size project, not more than 4 months on GI supervision, plus contract document preparation and contract administration experience.</li><li>Your evidence: ARE on GE/2020/05, Jul 2021 to Jul 2025, full-time resident on slope upgrading works (well over 12 months, continuous).</li><li>GI contracts: count as extra, but only up to 4 months towards the requirement.</li><li>Contract documents: Task Orders with drawings and cost estimates. Contract administration: NEC4 compensation events, early warnings, risk register, interim payments.</li></ul><p><i>Fill in:</i> contract value, number of features, your reporting line, and that you were resident (site office location).</p>`,
fu:"What was the most important thing you checked personally on site, and how did you record it?"},
{id:"H3",p:"H",q:"Walk us through one LPMit Stage 3 study you did, from desk study to design.",
a:`<ol><li>Feature and setting: type, height, angle, consequence category, what is below.</li><li>Desk study and API: site history, previous landslides, past works, services, geology map.</li><li>Inspection and mapping: signs of distress, seepage, drainage condition.</li><li>GI: what you planned and why (drillholes, trial pits, slope stripping, piezometers), key findings.</li><li>Ground and groundwater model; design parameters and where they came from.</li><li>Stability analysis: method (force and moment equilibrium), sections, design groundwater, FOS required (Table 5.5 of Geoguide 7 for existing slopes), results.</li><li>Upgrading design: soil nails, drainage, surface cover; why this option.</li><li>Cost estimate, Maintenance Manual.</li></ol><p><i>Fill in:</i> one real feature. Have a sketch of the cross-section with geology and groundwater ready.</p>`,
fu:"If the GI had found groundwater 3 m higher than you assumed, what would change?"},
{id:"H4",p:"H",q:"How did you assess the natural hillside in your Stage 3(H) study?",
a:`<ul><li>Catchment definition, API for past landslides and terrain features, field mapping of drainage lines, boulders and colluvium.</li><li>Hazard types considered: open hillslope landslide, channelised debris flow, boulder fall.</li><li>Design event volume and debris mobility to the facility; or a QRA if used.</li><li>Mitigation chosen (e.g. rigid or flexible barrier, boulder stabilisation) and why.</li></ul><p><i>Fill in:</i> your site, the design event volume, and the barrier type and size.</p>`},
{id:"H5",p:"H",q:"In your Stage 2 studies, how did you decide whether to recommend a Dangerous Hillside Order?",
a:`<ul><li>Desk study and API, site inspection, safety screening of the private feature.</li><li>Stability check of the existing feature, using available records and conservative assumptions.</li><li>Recommendation: DH Order (under s.27A of the Buildings Ordinance) if the feature is found to be dangerous or liable to become dangerous; otherwise an advisory letter for maintenance.</li><li>Explain one borderline case and your judgement.</li></ul><p><i>Fill in:</i> numbers of features screened and outcomes.</p>`,
fu:"How do you handle uncertainty when you have no GI for a private feature?"},
{id:"H6",p:"H",q:"What did you do on the BD DH Order consultancies, and how did they differ from LPMit work?",
a:`<ul><li>Prepared Preliminary Design Report, Geotechnical Assessment Proposal and Detailed Design Report in response to DH Orders.</li><li>Difference: private slopes under the Buildings Ordinance; works on behalf of BD when owners don't comply (default works), with cost recovery, and stricter documentation.</li><li>Liaison with owners, residents, government departments and utilities.</li></ul><p><i>Fill in:</i> one feature and the design adopted.</p>`},
{id:"H7",p:"H",q:"Explain the sub-soil drainage system you designed for the Tseung Kwan O Area 66 town park.",
a:`<ul><li>Why it was needed: the groundwater or site issue it addressed (from desk study and API).</li><li>Design basis: catchment, expected flows, permeability, design groundwater level.</li><li>Layout and components: drains, filters (retention and permeability criteria), outlets, maintenance access.</li><li>Checks: capacity, blockage risk, effect on nearby structures if water is lowered.</li></ul><p><i>Fill in:</i> all of the above from your design report. Expect "How did you size the pipes?" and "How did you choose the filter?"</p>`},
{id:"H8",p:"H",q:"Describe a site problem on GE/2020/05 and how you solved it.",
a:`<p>Use situation → judgement → action → outcome → reflection. Good examples:</p><ul><li>Ground or groundwater different from design (e.g. hole collapse, high grout take, water in drillholes, unexpected rockhead).</li><li>Pit-by-pit excavation showing instability or seepage.</li><li>Clash of soil nails with services or boulders.</li><li>Barrier foundation or anchor issue.</li></ul><p>Show you informed the designer, assessed risk, and kept records. Link to Geoguide 7 where relevant (e.g. excessive grout take must be reported to the designer).</p><p><i>Fill in:</i> your real case.</p>`,
fu:"What would have happened if you had not acted?"},
{id:"H9",p:"H",q:"Describe a compensation event you assessed under NEC4.",
a:`<ul><li>The event and which clause it fell under (e.g. physical conditions, 60.1(12), or a Project Manager instruction).</li><li>How you checked entitlement, and whether an early warning had been given.</li><li>How you assessed time and cost (defined cost, programme impact).</li><li>Outcome, and what you learned about managing ground risk.</li></ul><p><i>Fill in:</i> your real CE with numbers.</p>`},
{id:"H10",p:"H",q:"On your GI contracts, how did you make sure the GI results were reliable?",
a:`<ul><li>Planning: objectives from the ground model, locations, methods, depths.</li><li>On site: method compliance, SPT procedure, sampling (e.g. Mazier), water levels each shift, safety on slopes.</li><li>Logging checked against <b>Geoguide 3</b> (Guide to Rock and Soil Descriptions); Geoguide 2 covers the site investigation itself. Correct this wording in your T&E report if needed.</li><li>Give one example of an error or anomaly you found and corrected.</li></ul><p><i>Fill in:</i> your example.</p>`},
{id:"H11",p:"H",q:"How did you prepare a Task Order and its cost estimate?",
a:`<ul><li>Scope from the design and site conditions; drawings prepared.</li><li>Quantities taken off, rates applied, contingency for ground risk.</li><li>Check against budget and expenditure forecast; approval route.</li><li>This shows contract document preparation and cost estimating, which the assessors check (and which replaces the Technical Proposal and Cost Estimate on other routes).</li></ul><p><i>Fill in:</i> one Task Order: scope, value, how you priced soil nails.</p>`},
{id:"H12",p:"H",q:"Your Robinson Road project is in the Mid-Levels. What geotechnical controls apply there?",
a:`<ul><li>Mid-Levels is <b>Scheduled Area No. 1</b> under Schedule 5 of the Buildings Ordinance, because of deep weathering, steep terrain, complex groundwater and a history of major landslides (e.g. Po Shan Road, 1972).</li><li>Works there get extra geotechnical control, e.g. on excavation, foundations and groundwater drainage works, with RGE involvement for private projects.</li><li>For your road works: check effects of excavation and drainage changes on slopes and walls, utility leaks, and groundwater.</li><li>Keep this answer short in the interview: this project was mainly road and drainage, so don't overstate its geotechnical content.</li></ul>`},
{id:"H13",p:"H",q:"(C5) Tell us about an engineering decision you were responsible for.",
a:`<ul><li>Choose a decision that was yours (e.g. accepting or rejecting a soil nail, changing a nail length on site, stopping work in heavy rain, recommending a DH Order).</li><li>State the options, the information you used, the risk of each option, and why you chose as you did.</li><li>Say what would have happened if you were wrong, and how you limited that risk (e.g. extra test, monitoring).</li><li>Mention who you consulted and how you recorded the decision.</li></ul><p><i>Fill in:</i> your example.</p>`},
{id:"H14",p:"H",q:"You only have 1.5 years post-qualification experience. Why are you ready for MHKIE(G)?",
a:`<ul><li>Stay calm: this is an adversity-oriented question.</li><li>Point to over 7 years of geotechnical work covering investigation, design, construction and contract administration, with real responsibility (ARE for four years; Service Manager's delegate now).</li><li>Show self-awareness: name your weaker areas (e.g. foundations, deep excavation) and what you are doing about them.</li><li>Show commitment: CPD, Geotechnical Division events, reading.</li></ul>`},
{id:"H15",p:"H",q:"Looking back on GE/2020/05, what would you do differently?",
a:`<ul><li>Pick something real and modest: earlier GI at a difficult location, an earlier site trial for nails, better communication with residents, or tighter programme control in the wet season.</li><li>Explain why, and what you now do differently.</li><li>This shows reflection, which the interview explicitly assesses.</li></ul>`},
{id:"E33",p:"E",q:"What is the stress concentration around a circular tunnel in elastic rock?",
a:`<ul><li>Kirsch solution. In-situ vertical stress σ<sub>v</sub>, horizontal stress Kσ<sub>v</sub>. At the tunnel boundary, radial stress is zero and tangential stress is:</li></ul><div class="f">σ<sub>θ</sub> = σ<sub>v</sub>[(1 + K) + 2(1 − K) cos 2θ]</div><ul><li>θ measured from the horizontal axis. Sidewall (θ = 0): σ<sub>θ</sub> = (3 − K)σ<sub>v</sub>. Crown and invert (θ = 90°): σ<sub>θ</sub> = (3K − 1)σ<sub>v</sub>.</li><li>Hydrostatic stress (K = 1): σ<sub>θ</sub> = 2σ<sub>v</sub> all round.</li><li>If K &lt; 1/3, the crown goes into tension, so roof wedges can loosen and fall. High K concentrates stress in the crown.</li><li>Stress concentration dies away within about one to two diameters.</li></ul>`,
fu:"What happens if the boundary stress exceeds the rock mass strength?"},
{id:"E34",p:"E",q:"What are the Scheduled Areas and the Designated Area, and why are they controlled?",
a:`<p>Schedule 5 of the Buildings Ordinance lists five Scheduled Areas:</p><div class="tw"><table><tr><th>No.</th><th>Area</th><th>Main concern</th></tr><tr><td>1</td><td>Mid-Levels</td><td>Deep weathering, steep slopes, groundwater, landslide history</td></tr><tr><td>2</td><td>North-west New Territories</td><td>Marble with solution cavities</td></tr><tr><td>3</td><td>Railway Protection Areas</td><td>Protecting railway tunnels and structures</td></tr><tr><td>4</td><td>Ma On Shan</td><td>Marble with cavities</td></tr><tr><td>5</td><td>Sewage Tunnel Protection Areas</td><td>Protecting deep sewage tunnels</td></tr></table></div><ul><li>The <b>Designated Area of Northshore Lantau</b> also has complex geology including marble; foundations there follow special conditions (GEO TGN 12, PNAP APP-134).</li><li>Works in these areas have extra geotechnical control, e.g. extensive GI, RGE supervision and performance reviews for foundations in Areas 1, 2 and 4 and the Designated Area.</li></ul>`},
{id:"B24",p:"B",q:"What are typical shear strengths of rock joint infills of different minerals?",
a:`<ul><li>Clean rough rock joints: friction angle commonly 30–40°+ including roughness.</li><li>Clay infills are much weaker, and the residual friction angle depends strongly on mineral. Roughly, from weakest: montmorillonite (smectite) lowest, then illite, then kaolinite; chlorite and talc coatings are also weak. Check values in Deere & Patton (1971) or Hoek & Bray, as cited in Geoguide 1.</li><li>In Hong Kong, kaolin infill in relict joints of weathered granite and manganese oxide coatings are common weak features (e.g. the Fei Tsui Road failure).</li><li>If the infill is thicker than the joint roughness, use infill strength; slickensides reduce it further.</li></ul>`},
{id:"A51",p:"A",q:"Outline the approach to a natural terrain hazard study.",
a:`<ol><li>Define the catchment and the facilities at risk.</li><li>Desk study: aerial photograph interpretation, landslide inventories, geology, previous studies.</li><li>Field mapping: landslide scars, drainage lines, colluvium, boulders, seepage.</li><li>Identify hazard types: open hillslope landslides, channelised debris flows, boulder falls.</li><li>Assess hazards: design event approach (design landslide volume, debris mobility to facilities) or quantitative risk assessment where justified.</li><li>Choose mitigation: avoidance, source stabilisation, or barriers (rigid or flexible), and maintenance.</li></ol><p>Reference: GEO's guidelines on natural terrain hazard studies (e.g. GEO Report 138), and later GEO guidance.</p>`},
{id:"D23",p:"D",q:"Summarise Hong Kong's geology and explain the geological, ground and design model approach.",
a:`<ul><li>Rocks: mainly volcanic (tuff, rhyolite) and granitic intrusions, with smaller areas of sedimentary and metasedimentary rocks (including marble in the north-west New Territories and Ma On Shan).</li><li>Deep chemical weathering profiles (saprolite, corestones), superficial deposits (colluvium, alluvium, marine deposits), fill and reclamation.</li><li>Dykes, faults and relict joints can act as water barriers or weak planes.</li><li>Geoguide 7 §5.3.3 three-step approach: <b>geological model</b> (geology, geomorphology, hydrogeology); <b>ground model</b> (zones with similar engineering properties and boundaries); <b>design model</b> (how ground and works respond, for analysis). Update the models as construction reveals more.</li></ul>`},
{id:"F28",p:"F",q:"Name the key Hong Kong geotechnical documents and what each covers.",
a:`<div class="tw"><table><tr><th>Document</th><th>Covers</th></tr><tr><td>Geotechnical Manual for Slopes</td><td>Slope design, FOS, groundwater, drainage</td></tr><tr><td>Geoguide 1</td><td>Retaining wall design</td></tr><tr><td>Geoguide 2</td><td>Site investigation</td></tr><tr><td>Geoguide 3</td><td>Rock and soil descriptions</td></tr><tr><td>Geoguide 4</td><td>Cavern engineering</td></tr><tr><td>Geoguide 5</td><td>Slope maintenance</td></tr><tr><td>Geoguide 6</td><td>Reinforced fill</td></tr><tr><td>Geoguide 7</td><td>Soil nails</td></tr><tr><td>GEO Pub 1/2007</td><td>Engineering geological practice</td></tr><tr><td>GEO Pub 1/2009</td><td>Prescriptive measures</td></tr><tr><td>GEO Pub 1/2011</td><td>Landscape treatment for slopes</td></tr><tr><td>GEO Pub 1/2023</td><td>Deep excavation</td></tr><tr><td>Code of Practice for Foundations 2017</td><td>Foundations (BD)</td></tr><tr><td>Geospecs, GEO TGNs, PNAPs</td><td>Specifications, technical updates, BD practice</td></tr></table></div><p>Always mention the edition you used, and check for the latest continuously updated version.</p>`},
{id:"E35",p:"E",q:"What assumptions and checks matter in numerical (finite element) modelling of geotechnical problems?",
a:`<ul><li>Constitutive model: linear elastic-perfectly plastic (Mohr-Coulomb) is simple but poor for deformation; hardening or small-strain models give better movements near excavations.</li><li>Drainage: drained or undrained (effective stress with undrained behaviour, or total stress); consolidation analysis if time matters.</li><li>Initial stresses (K<sub>0</sub>), staged construction sequence, groundwater and pore pressures.</li><li>Geometry: boundaries far enough away, mesh refined where stresses change, interface elements for wall–soil contact.</li><li>Outputs: strength reduction factor of safety for stability; deformations for serviceability.</li><li>Calibrate against monitoring or case histories, do sensitivity checks, and compare with hand calculations. Physical models (e.g. centrifuge) must respect scaling laws.</li></ul>`,
fu:"Why might an FE analysis give a different FOS from a limit equilibrium analysis?"}
);
Q.sort((x,y)=>x.p===y.p?(parseInt(x.id.slice(1))-parseInt(y.id.slice(1))):x.p.localeCompare(y.p));

const KEY="mhkieg-drill-v1";
const $=s=>document.querySelector(s);
let state={filter:"all",order:Q.map((_,i)=>i),pos:0,revealed:false,seen:{},flags:{}};

function load(){try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(!s)return;
  if(Array.isArray(s.order)&&s.order.length===Q.length)state={...state,...s,revealed:false};
  else state={...state,seen:s.seen||{},flags:s.flags||{},filter:s.filter||"all"};
}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({filter:state.filter,order:state.order,pos:state.pos,seen:state.seen,flags:state.flags}));}catch(e){}}

function list(){
  return state.order.filter(i=>{
    const q=Q[i];
    if(state.filter==="all")return true;
    if(state.filter==="flag")return !!state.flags[q.id];
    return q.p===state.filter;
  });
}

function renderFilters(){
  const opts=[["all","All"],...Object.keys(PARTS).map(k=>[k,"Part "+k]),["flag","Review later"]];
  $("#filters").innerHTML=opts.map(([k,l])=>{
    const sw=PARTS[k]?`<span class="sw" style="background:var(--${k})"></span>`:"";
    return `<button class="chip" type="button" data-f="${k}" aria-pressed="${state.filter===k}">${sw}${l}</button>`;
  }).join("");
}

function render(){
  const L=list();
  if(state.pos>=L.length)state.pos=Math.max(0,L.length-1);
  const card=$("#card");
  $("#log").innerHTML=L.map((i,n)=>`<span data-n="${n}" class="${state.seen[Q[i].id]?"done":""} ${n===state.pos?"cur":""}" style="background:var(--${Q[i].p})"></span>`).join("");
  if(!L.length){
    $("#count").textContent="0 questions";
    card.innerHTML=`<p class="empty">No questions marked for review yet. While studying, tap “Review later” on any question you want to come back to.</p>`;
    $("#main").disabled=true;$("#prev").disabled=true;$("#flag").disabled=true;
    return;
  }
  $("#main").disabled=false;$("#prev").disabled=false;$("#flag").disabled=false;
  const q=Q[L[state.pos]];
  $("#count").textContent=`${state.pos+1} of ${L.length}`;
  card.style.setProperty("--accent",`var(--${q.p})`);
  let h=`<p class="part"><span class="sw" style="background:var(--${q.p})"></span>${q.id} · ${PARTS[q.p]}</p><h2 class="q">${q.q}</h2>`;
  if(state.revealed){
    h+=`<div class="a reveal">${q.a}${q.fu?`<div class="fu"><b>Assessor follow-up</b>${q.fu}</div>`:""}</div>`;
  }else{
    h+=`<p class="hint">Say your answer out loud, and picture the sketch you would draw. Then check it.</p>`;
  }
  card.innerHTML=h;
  $("#main").textContent=state.revealed?(state.pos===L.length-1?"Back to first question":"Next question"):"Show answer";
  const f=!!state.flags[q.id];
  $("#flag").setAttribute("aria-pressed",f);
  $("#flag").textContent=f?"Marked for review":"Review later";
}

function go(d){
  const L=list();if(!L.length)return;
  state.pos=(state.pos+d+L.length)%L.length;state.revealed=false;
  $("#card").scrollTop=0;save();render();
}
function main(){
  const L=list();if(!L.length)return;
  if(!state.revealed){state.revealed=true;state.seen[Q[L[state.pos]].id]=1;save();render();}
  else go(1);
}

$("#main").onclick=main;
$("#prev").onclick=()=>go(-1);
$("#flag").onclick=()=>{const L=list();if(!L.length)return;const id=Q[L[state.pos]].id;if(state.flags[id])delete state.flags[id];else state.flags[id]=1;save();if(state.filter==="flag"&&!state.flags[id]){render();}else render();};
$("#filters").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;state.filter=b.dataset.f;state.pos=0;state.revealed=false;save();renderFilters();render();};
$("#log").onclick=e=>{const s=e.target.closest("span");if(!s)return;state.pos=+s.dataset.n;state.revealed=false;save();render();};
$("#shuffle").onclick=()=>{const o=Q.map((_,i)=>i);for(let i=o.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[o[i],o[j]]=[o[j],o[i]];}state.order=o;state.pos=0;state.revealed=false;save();render();};
$("#reset").onclick=()=>{state.order=Q.map((_,i)=>i);state.pos=0;state.revealed=false;state.seen={};save();render();};
document.addEventListener("keydown",e=>{if(e.target.tagName==="BUTTON"&&(e.key===" "||e.key==="Enter"))return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();main();}else if(e.key==="ArrowLeft"){go(-1);}});
let tx=null,ty=null;
$("#card").addEventListener("touchstart",e=>{tx=e.touches[0].clientX;ty=e.touches[0].clientY;},{passive:true});
$("#card").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){dx<0?main():go(-1);}tx=null;},{passive:true});

load();renderFilters();render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{});}
</script>
</body>
</html>

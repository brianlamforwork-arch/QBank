.log span.cur{opacity:1;box-shadow:inset 0 0 0 2px var(--ink)}

.part{font-size:.8125rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px;margin:0 0 10px}
.part .sw{width:10px;height:10px;border-radius:2px}
.q{font-family:var(--sans);font-weight:600;font-size:1.25rem;line-height:1.38;margin:0 0 18px}
.hint{font-size:.9375rem;color:var(--muted);line-height:1.5;border-top:1px dashed var(--rule);padding-top:14px}
.a{font-family:var(--serif);font-size:1.0625rem;line-height:1.62;border-top:1px solid var(--rule);padding-top:14px}

.a .f{font-family:var(--serif);font-style:italic;background:var(--soft);padding:8px 12px;border-radius:6px;margin:.6em 0 1em;overflow-x:auto;white-space:nowrap}
.a table{border-collapse:collapse;font-family:var(--sans);font-size:.875rem;margin:.6em 0 1em;min-width:420px}
.a .tw{overflow-x:auto}
.a th,.a td{border-bottom:1px solid var(--rule);text-align:left;padding:6px 8px;vertical-align:top}
.a th{font-weight:600}
.fu{font-family:var(--sans);font-size:.9375rem;line-height:1.5;margin-top:18px;padding:10px 12px;border-left:3px solid var(--accent,var(--muted));background:var(--soft);border-radius:0 6px 6px 0}

footer{padding:10px 16px 14px;display:grid;grid-template-columns:auto auto 1fr;gap:8px;background:var(--paper);border-top:1px solid var(--rule)}
